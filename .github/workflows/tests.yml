name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install service dependencies
        run: pip install -r requirements.txt

      - name: Start the service
        run: |
          uvicorn app.main:app &
          sleep 5

      - name: Install test dependencies
        run: pip install -r api_automation/requirements.txt

      - name: Run tests
        run: |
          cd api_automation
          pytest -v --tb=short --junitxml=reports/results.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: api_automation/reports/

name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Allure CLI
        run: |
          curl -sL https://github.com/allure-framework/allure2/releases/download/2.30.0/allure-2.30.0.tgz | tar -xz -C /opt/
          echo "/opt/allure-2.30.0/bin" >> $GITHUB_PATH

      - name: Install service dependencies
        run: pip install -r requirements.txt

      - name: Start the service
        run: |
          uvicorn app.main:app &
          sleep 5

      - name: Install test dependencies
        run: pip install -r api_automation/requirements.txt

      - name: Run tests
        run: |
          cd api_automation
          pytest -v --tb=short --alluredir=reports/allure-results --junitxml=reports/results.xml
        continue-on-error: true

      - name: Get Allure history
        continue-on-error: true
        run: |
          git fetch origin gh-pages --depth=1 || true
          git checkout origin/gh-pages -- history 2>/dev/null || true
          mkdir -p api_automation/reports/allure-results/history
          cp -r history/* api_automation/reports/allure-results/history/ 2>/dev/null || true
          rm -rf history

      - name: Generate Allure report
        if: always()
        run: allure generate api_automation/reports/allure-results -o allure-report --clean

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            api_automation/reports/results.xml
            api_automation/reports/allure-results/
